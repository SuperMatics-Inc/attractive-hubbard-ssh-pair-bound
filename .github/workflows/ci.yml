name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifest and replay pins
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('replay')
          pins = json.loads((root / 'SOURCE-PINS.json').read_text())
          expected = {'replay.py'}
          files = pins.get('files', [])
          if pins.get('format') != 1 or {item.get('path') for item in files} != expected:
              raise SystemExit('Unexpected replay source pin manifest')
          for entry in files:
              source = root / entry['path']
              if hashlib.sha256(source.read_bytes()).hexdigest() != entry['sha256']:
                  raise SystemExit(f'Source pin mismatch: {source}')
          PY
      - name: Install pinned replay dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.5 scipy==1.18.1 mpmath==1.4.1 python-flint==0.9.0
      - name: Run the base replay
        run: |
          set -euo pipefail
          (cd replay && python -B replay.py) | tee replay-base.out
          grep -qF 'SSHBOUND3 replay: ALL CERTIFIED AND NUMERICAL CHECKS PASSED' replay-base.out
      - name: Run all guarded mutants
        run: |
          set -euo pipefail
          (cd replay && python -B replay.py --all-mutants) | tee replay-mutants.out
          grep -qF 'ALL 16 MATHEMATICAL MUTANTS REJECTED' replay-mutants.out
      - uses: actions/upload-artifact@v4
        with:
          name: attractive-hubbard-ssh-pair-bound-replay
          path: |
            replay-base.out
            replay-mutants.out
          if-no-files-found: error
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript
        working-directory: paper
        run: |
          set -euo pipefail -x
          mkdir -p ../build
          tectonic --keep-logs --outdir ../build main.tex
          if grep -nE 'Overfull|Underfull|Undefined|Warning|Citation.*undefined|There were' ../build/main.log; then exit 1; fi
          test -s ../build/main.pdf
          pdfinfo ../build/main.pdf > ../build/pdfinfo.txt
          grep -Eq '^Pages:[[:space:]]+5$' ../build/pdfinfo.txt
      - name: Check the committed artifact
        working-directory: paper
        run: |
          set -euo pipefail -x
          test -s main.pdf
          pdfinfo main.pdf > pdfinfo.txt
          grep -Eq '^Pages:[[:space:]]+5$' pdfinfo.txt
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://orcid.org/0000-0001-5839-5197' urls.txt
          grep -qF 'https://github.com/SuperMatics-Inc/attractive-hubbard-ssh-pair-bound' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24406987' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24406989' urls.txt
          pdftotext -layout main.pdf paper-text.txt
          if grep -niE '—|---|awaits review|patentability|confirmed material|synthesi[sz]ed|\b(first|priority)\b' paper-text.txt; then exit 1; fi
          if grep -nE '\b(PROVED|CERTIFIED|NUMERICAL|INFERENCE|OPEN)\b' paper-text.txt; then exit 1; fi
          if grep -nE 'ADIABATIC|SSHBOUND|STAGE[0-9A-Z_-]*|HUBHOL|EXTHOL|LINEAR[0-9]+(-[0-9]+)?|R7|OPTIMUM|UNIV-GLUE' paper-text.txt; then exit 1; fi
          grep -qF 'Davis Rens' paper-text.txt
          grep -qF 'SuperMatics Inc.' paper-text.txt
          grep -qF 'ORCID 0000-0001-5839-5197' paper-text.txt
          grep -qF '10.5281/zenodo.24406987' paper-text.txt
          grep -qF '10.5281/zenodo.24406989' paper-text.txt
          grep -qF 'This preprint has not been peer reviewed.' main.tex
          grep -qF 'This preprint has not been peer reviewed.' ../README.md
          paper_flat="$(tr '\n' ' ' < paper-text.txt)"
          printf '%s\n' "$paper_flat" | grep -qF 'AI agents generated the proofs, code and drafts under D. Rens'
          printf '%s\n' "$paper_flat" | grep -qF 'This preprint has not been peer reviewed.'
      - name: Compare the rebuild with the committed PDF
        working-directory: paper
        run: |
          set -euo pipefail -x
          pdftotext -layout ../build/main.pdf build-text.txt
          committed="$(pdftotext -layout main.pdf - | tr -s '[:space:]' ' ')"
          rebuilt="$(pdftotext -layout ../build/main.pdf - | tr -s '[:space:]' ' ')"
          test "$committed" = "$rebuilt"
      - uses: actions/upload-artifact@v4
        with:
          name: attractive-hubbard-ssh-pair-bound-paper
          path: |
            paper/main.pdf
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
            paper/pdfinfo.txt
            paper/paper-text.txt
            build/main.log
          if-no-files-found: error
